<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIBOOR Trident 350 AWD — руководство R3</title>
<style>html,body{margin:0;height:100%;font:15px system-ui,sans-serif;background:#111827;color:#f3f4f6}header{height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#1f2937}button,a{color:#fff;background:#2563eb;border:0;border-radius:6px;padding:8px 12px;text-decoration:none;cursor:pointer}#status{margin-left:auto;color:#cbd5e1}iframe{width:100%;height:calc(100% - 48px);border:0;background:#fff}</style></head>
<body><header><a href="./SIBOOR_TRIDENT_350_AWD_JUNE_2024_R3.pdf" download>Скачать PDF R3</a><button id="source">Скачать оригинальный PDF SIBOOR</button><span id="status">Загружаю иллюстрированное руководство…</span></header><iframe id="manual" title="Иллюстрированное руководство по сборке"></iframe>
<script>
const status=document.getElementById('status');
async function bytes(names){const arrays=await Promise.all(names.map(async n=>{const r=await fetch('./parts/'+n);if(!r.ok)throw new Error('Не загрузился файл '+n);return new Uint8Array(await r.arrayBuffer())}));const size=arrays.reduce((s,a)=>s+a.length,0),out=new Uint8Array(size);let at=0;for(const a of arrays){out.set(a,at);at+=a.length}return out}
(async()=>{try{const html=await bytes(['manual-html-01.bin','manual-html-02.bin']);document.getElementById('manual').srcdoc=new TextDecoder('utf-8').decode(html);status.textContent='Руководство загружено';}catch(e){status.textContent=e.message;}})();
document.getElementById('source').addEventListener('click',async()=>{const b=document.getElementById('source');b.disabled=true;status.textContent='Собираю исходный PDF…';try{const pdf=await bytes(['official-source-pdf-01.bin','official-source-pdf-02.bin','official-source-pdf-03.bin','official-source-pdf-04.bin']);const u=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download='SIBOOR_Assembly_Manual_JUNE_2024_Official_2024-12-31.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);status.textContent='Загрузка PDF началась';}catch(e){status.textContent=e.message;}finally{b.disabled=false;}});
</script></body></html>
