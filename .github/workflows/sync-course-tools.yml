name: Sync course tools from canonical registry

on:
  push:
    branches: [main]
    paths:
      - 'school-ai-courses/data/tools-registry.json'
      - 'scripts/sync-course-tools.mjs'
      - 'school-ai-courses/tools/index.html'
      - 'school-ai-courses/adults/tools/index.html'
      - 'school-ai-courses/tools/search-index.json'
      - 'school-ai-courses/adults/tools/search-index.json'
      - '.github/workflows/sync-course-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-course-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine whether registry or generator was updated
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" HEAD -- \
            school-ai-courses/data/tools-registry.json \
            scripts/sync-course-tools.mjs \
            .github/workflows/sync-course-tools.yml | grep -q .; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate catalog pages and Groq search indexes
        if: steps.changes.outputs.generate == 'true'
        run: node scripts/sync-course-tools.mjs --write

      - name: Verify single source and exact output
        run: node scripts/sync-course-tools.mjs --check

      - name: Publish generated files (registry changes only)
        if: steps.changes.outputs.generate == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            school-ai-courses/tools/index.html \
            school-ai-courses/tools/search-index.json \
            school-ai-courses/adults/tools/index.html \
            school-ai-courses/adults/tools/search-index.json
          if git diff --cached --quiet; then
            echo 'Outputs already match the registry.'
            exit 0
          fi
          git commit -m 'build: synchronize course catalog cards and Groq indexes'
          git push origin HEAD:main

      - name: Reject uncatalogued manual HTML or index changes
        if: failure() && steps.changes.outputs.generate == 'false'
        run: |
          echo 'Do not edit generated catalog cards or indexes directly.'
          echo 'Add or change the service in school-ai-courses/data/tools-registry.json.'
