<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скоро</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #171717;
    }
    p {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 600;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111214; color: #f5f5f2; }
    }
  </style>
</head>
<body>
  <p>скоро здесь появится что-то</p>
</body>
</html>
