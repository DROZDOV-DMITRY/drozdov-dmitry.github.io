<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Найди пару · пример игры</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#273665,#090f27 65%);color:#f6f7ff;font:16px/1.4 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,900px);border:1px solid #ffffff28;border-radius:26px;padding:clamp(18px,4vw,32px);background:#101a35dd;box-shadow:0 22px 70px #0008}header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}h1{margin:0;font-size:clamp(27px,5vw,44px);line-height:1.05}p{color:#cad4f2;margin:10px 0}.back{color:#b9dcff;text-decoration:none;font-weight:700}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.pill{border-radius:12px;background:#ffffff12;padding:9px 14px;font-weight:800}.btn{border:0;border-radius:13px;padding:12px 18px;background:#f8c85b;color:#17203f;font-weight:900;font-size:16px;cursor:pointer}.field{position:relative;border-radius:22px;min-height:350px;overflow:hidden;background:linear-gradient(145deg,#101e49,#231346);border:1px solid #ffffff33;display:grid;place-items:center}
.field{padding:18px}.board{width:min(100%,520px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:0;border-radius:15px;font-size:clamp(25px,6vw,42px);font-weight:900;background:linear-gradient(145deg,#4d75c6,#7253b6);color:white;cursor:pointer;box-shadow:0 5px 0 #273767}.card.open,.card.matched{background:#fff3cc;color:#17233e}.card.matched{opacity:.6}.win{position:absolute;background:#102040f2;padding:18px;border-radius:16px;font-weight:900;text-align:center}</style></head><body><main class="wrap"><header><div><h1>Найди пару</h1><p>Открой шесть пар питомцев за наименьшее число ходов.</p></div><a class="back" href="../">← К каталогу примеров</a></header><div class="hud"><span class="pill">Ходы: <b id="moves">0</b></span><span class="pill">Пары: <b id="found">0</b>/6</span><button class="btn" id="new">Начать заново</button></div><p>Открывай по две карточки. Если питомцы разные, они закроются через секунду.</p><div class="field"><div class="board" id="board"></div><div class="win" id="win" hidden></div></div><script>const pets=["🐱","🐶","🐼","🦊","🐸","🐵"];let first=null,lock=false,moves=0,found=0;function start(){first=null;lock=false;moves=found=0;document.querySelector("#moves").textContent=0;document.querySelector("#found").textContent=0;document.querySelector("#win").hidden=true;let arr=[...pets,...pets].sort(()=>Math.random()-.5),b=document.querySelector("#board");b.innerHTML="";arr.forEach(v=>{let x=document.createElement("button");x.className="card";x.textContent="?";x.dataset.pet=v;x.onclick=()=>flip(x);b.appendChild(x)})}function flip(x){if(lock||x.classList.contains("open")||x.classList.contains("matched"))return;x.classList.add("open");x.textContent=x.dataset.pet;if(!first){first=x;return}moves++;document.querySelector("#moves").textContent=moves;let prev=first;first=null;if(prev.dataset.pet===x.dataset.pet){prev.classList.add("matched");x.classList.add("matched");found++;document.querySelector("#found").textContent=found;if(found===6){let w=document.querySelector("#win");w.hidden=false;w.textContent="Готово! Все пары за "+moves+" ходов."}}else{lock=true;setTimeout(()=>{prev.classList.remove("open");x.classList.remove("open");prev.textContent=x.textContent="?";lock=false},1000)}}document.querySelector("#new").onclick=start;start();</script></main></body></html>
