<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Колония на Марсе: Командир базы · пример игры</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#273665,#090f27 65%);color:#f6f7ff;font:16px/1.4 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,980px);border:1px solid #ffffff28;border-radius:26px;padding:clamp(18px,4vw,32px);background:#101a35dd;box-shadow:0 22px 70px #0008}header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}h1{margin:0;font-size:clamp(27px,5vw,44px);line-height:1.05}p{color:#cad4f2;margin:10px 0}.back{color:#b9dcff;text-decoration:none;font-weight:700}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:16px 0}.pill{border-radius:12px;background:#ffffff12;padding:9px 14px;font-weight:800}.btn{border:0;border-radius:13px;padding:10px 13px;background:#f8c85b;color:#17203f;font-weight:900;font-size:14px;cursor:pointer}.arena{background:#080d22;border:1px solid #ffffff33;border-radius:20px;overflow:hidden}.arena canvas{display:block;width:100%;height:auto}.hint{font-size:13px;color:#bdcae8}
.arena{overflow:auto}.arena canvas{min-width:720px}.hud .pill{flex:1;text-align:center}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}</style></head><body><main class="wrap"><header><div><h1>Колония на Марсе: Командир базы</h1><p>Добывай металл, строй базу и переживи три рейда.</p></div><a class="back" href="../">← К каталогу примеров</a></header><div class="hud"><span class="pill">Металл: <b id="metal">160</b></span><span class="pill">Энергия: <b id="energy">3/0</b></span><span class="pill">Центр: <b id="basehp">20</b></span><span class="pill">Рейд: <b id="wave">0</b>/3</span></div><div class="tools"><button class="btn" data-build="solar">☀️ Станция · 60</button><button class="btn" data-build="factory">🏭 Завод · 100</button><button class="btn" data-build="turret">🛡 Турель · 80</button><button class="btn" id="pause">Пауза</button><button class="btn" id="again">Новая игра</button></div><div class="arena"><canvas id="c" width="840" height="540"></canvas></div><p class="hint" id="msg">Рабочие добывают металл автоматически. Выбери бойца и кликни по врагу; строй объекты на свободных клетках.</p><script>const c=document.querySelector("#c"),g=c.getContext("2d"),C=14,R=9,S=60;let metal,basehp,build,units,enemies,ore,selected,mode,paused,wave,timer,last,raid,gameover;function reset(){metal=160;basehp=20;build=[{x:1,y:4,t:"base"}];units=[{x:2,y:3,t:"worker",sel:false},{x:2,y:5,t:"worker",sel:false},{x:3,y:4,t:"soldier",sel:false}];enemies=[];ore=[{x:5,y:2,amt:30},{x:6,y:7,amt:30},{x:9,y:4,amt:30}];selected=null;mode="";paused=false;wave=0;timer=0;raid=30;gameover=false;document.querySelector("#msg").textContent="Рабочие добывают металл автоматически. Выбери бойца и кликни по врагу; строй объекты на свободных клетках."}function updateHud(){let gen=3+build.filter(b=>b.t==="solar").length*3,use=build.filter(b=>b.t==="factory").length*2+build.filter(b=>b.t==="turret").length;document.querySelector("#metal").textContent=metal;document.querySelector("#energy").textContent=gen+"/"+use;document.querySelector("#basehp").textContent=basehp;document.querySelector("#wave").textContent=wave}function cell(ev){let r=c.getBoundingClientRect();return{x:Math.floor((ev.clientX-r.left)*c.width/r.width/S),y:Math.floor((ev.clientY-r.top)*c.height/r.height/S)}}function occupied(x,y){return build.some(b=>b.x===x&&b.y===y)||units.some(u=>u.x===x&&u.y===y)}c.onclick=e=>{if(gameover||paused)return;let {x,y}=cell(e);if(mode){let costs={solar:60,factory:100,turret:80},use={solar:0,factory:2,turret:1}[mode],gen=3+build.filter(b=>b.t==="solar").length*3,current=build.filter(b=>b.t==="factory").length*2+build.filter(b=>b.t==="turret").length;if(x>=0&&x<C&&y>=0&&y<R&&!occupied(x,y)&&metal>=costs[mode]&&gen>=current+use){metal-=costs[mode];build.push({x,y,t:mode});document.querySelector("#msg").textContent="Построено: "+mode}mode="";updateHud();return}let u=units.find(q=>q.x===x&&q.y===y);if(u){selected=u;units.forEach(q=>q.sel=q===u);return}if(selected){let target=enemies.find(q=>q.x===x&&q.y===y);if(target&&selected.t==="soldier")selected.target=target;else if(selected.t==="worker"){selected.target=ore.reduce((a,b)=>Math.abs(b.x-x)+Math.abs(b.y-y)<Math.abs(a.x-x)+Math.abs(a.y-y)?b:a)}else selected.move={x,y}}};document.querySelectorAll("[data-build]").forEach(b=>b.onclick=()=>mode=b.dataset.build);document.querySelector("#pause").onclick=()=>{paused=!paused;document.querySelector("#pause").textContent=paused?"Продолжить":"Пауза"};document.querySelector("#again").onclick=reset;function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!paused&&!gameover){timer+=dt;raid-=dt;for(const u of units)if(u.t==="worker"){u.mine=(u.mine||0)+dt;if(u.mine>3){u.mine=0;metal+=6}}if(raid<=0&&wave<3){wave++;raid=30;for(let i=0;i<wave+1;i++)enemies.push({x:13,y:Math.random()*8|0,h:wave===3?4:2,cd:0});document.querySelector("#msg").textContent="Начался рейд "+wave+"!"}for(const en of enemies){en.cd+=dt;if(en.cd>1){en.cd=0;if(en.x>1)en.x-=1;else basehp--}}for(const b of build.filter(a=>a.t==="turret")){b.cd=(b.cd||0)+dt;if(b.cd>1){let en=enemies.find(e=>Math.abs(e.x-b.x)+Math.abs(e.y-b.y)<5);if(en){en.h--;b.cd=0}}}for(const u of units.filter(a=>a.t==="soldier"&&a.target)){u.cd=(u.cd||0)+dt;if(u.cd>0.7){if(u.target.h>0)u.target.h--;u.cd=0;if(u.target.h<=0){enemies=enemies.filter(e=>e!==u.target);u.target=null;metal+=10}}}if(basehp<=0){gameover=true;document.querySelector("#msg").textContent="База разрушена. Нажми «Новая игра»."}if(wave===3&&enemies.length===0&&timer>92){gameover=true;document.querySelector("#msg").textContent="Победа! Колония пережила рейды."}updateHud()}g.fillStyle="#9c5639";g.fillRect(0,0,840,540);for(let y=0;y<R;y++)for(let x=0;x<C;x++){g.fillStyle=(x+y)%2?"#a96343":"#b56d4a";g.fillRect(x*S,y*S,S-1,S-1);g.strokeStyle="#e0a06b44";g.strokeRect(x*S,y*S,S,S)}for(const q of ore){g.fillStyle="#69d9e8";g.beginPath();g.arc(q.x*S+30,q.y*S+30,15,0,7);g.fill();g.fillStyle="#183443";g.fillRect(q.x*S+20,q.y*S+28,20,5)}for(const b of build){g.fillStyle={base:"#d5c5ad",solar:"#4bb5e5",factory:"#454e63",turret:"#dca852"}[b.t];g.fillRect(b.x*S+8,b.y*S+8,44,44);g.fillStyle="#202b44";g.fillText({base:"⌂",solar:"☀",factory:"F",turret:"T"}[b.t],b.x*S+20,b.y*S+37)}for(const u of units){g.fillStyle=u.sel?"#fff":"#54eadf";g.beginPath();g.arc(u.x*S+30,u.y*S+30,u.t==="worker"?13:17,0,7);g.fill();g.fillStyle="#18223a";g.fillText(u.t==="worker"?"W":"B",u.x*S+24,u.y*S+35)}for(const e of enemies){g.fillStyle="#ff405b";g.fillRect(e.x*S+13,e.y*S+13,34,34);g.fillStyle="#111";g.fillRect(e.x*S+14,e.y*S+7,Math.max(4,e.h*8),4)}if(mode){g.fillStyle="#fff";g.fillText("Режим стройки: "+mode,10,18)}requestAnimationFrame(loop)}reset();loop(0);</script></main></body></html>
