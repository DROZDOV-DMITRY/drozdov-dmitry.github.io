<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Поймай звезду · пример игры</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#273665,#090f27 65%);color:#f6f7ff;font:16px/1.4 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,900px);border:1px solid #ffffff28;border-radius:26px;padding:clamp(18px,4vw,32px);background:#101a35dd;box-shadow:0 22px 70px #0008}header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}h1{margin:0;font-size:clamp(27px,5vw,44px);line-height:1.05}p{color:#cad4f2;margin:10px 0}.back{color:#b9dcff;text-decoration:none;font-weight:700}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:20px 0}.pill{border-radius:12px;background:#ffffff12;padding:9px 14px;font-weight:800}.field{position:relative;border-radius:22px;min-height:350px;overflow:hidden;background:linear-gradient(145deg,#101e49,#231346);border:1px solid #ffffff33;display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:12px 18px;background:#f8c85b;color:#17203f;font-weight:900;font-size:16px;cursor:pointer}.btn:hover{filter:brightness(1.08)}button:focus-visible,a:focus-visible{outline:3px solid #7ee9ff;outline-offset:3px}

<style>.field{height:390px;background:radial-gradient(circle at 65% 20%,#4e4aa1,#161b49 50%,#081126)}.star{position:absolute;border:0;background:none;font-size:62px;cursor:pointer;filter:drop-shadow(0 0 16px #ffd66d);touch-action:manipulation}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:42px 42px;opacity:.5}</style>
<div class="hud"><span class="pill">Очки: <b id="score">0</b></span><span class="pill">Время: <b id="time">30</b></span><button class="btn" id="again">Играть снова</button></div><div class="field" id="field"><div class="stars"></div><button class="star" id="star" aria-label="Поймать звезду">⭐</button><div id="end" hidden></div></div></style></head><body><main class="wrap"><header><div><h1>Поймай звезду</h1><p>Нажимай на звезду и набери больше очков за 30 секунд.</p></div><a class="back" href="../">← К каталогу примеров</a></header>
<style>.field{height:390px;background:radial-gradient(circle at 65% 20%,#4e4aa1,#161b49 50%,#081126)}.star{position:absolute;border:0;background:none;font-size:62px;cursor:pointer;filter:drop-shadow(0 0 16px #ffd66d);touch-action:manipulation}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:42px 42px;opacity:.5}</style>
<div class="hud"><span class="pill">Очки: <b id="score">0</b></span><span class="pill">Время: <b id="time">30</b></span><button class="btn" id="again">Играть снова</button></div><div class="field" id="field"><div class="stars"></div><button class="star" id="star" aria-label="Поймать звезду">⭐</button><div id="end" hidden></div></div><script>let score=0,left=30,timer;const f=document.querySelector("#field"),s=document.querySelector("#star");function place(){const r=f.getBoundingClientRect();s.style.left=Math.random()*(r.width-80)+"px";s.style.top=Math.random()*(r.height-80)+"px"}function start(){clearInterval(timer);score=0;left=30;document.querySelector("#score").textContent=score;document.querySelector("#time").textContent=left;document.querySelector("#end").hidden=true;s.hidden=false;place();timer=setInterval(()=>{left--;document.querySelector("#time").textContent=left;if(left<=0){clearInterval(timer);s.hidden=true;const e=document.querySelector("#end");e.hidden=false;e.textContent="Время! Ты поймал "+score+" звёзд.";e.style.cssText="position:absolute;font-size:24px;font-weight:900;background:#111c;padding:18px;border-radius:16px"}},1000)}s.onclick=()=>{if(left<=0)return;score++;document.querySelector("#score").textContent=score;place()};document.querySelector("#again").onclick=start;window.onresize=place;start();</script></main></body></html>
