<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Турбо-трасса: Ночной заезд · пример игры</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#273665,#090f27 65%);color:#f6f7ff;font:16px/1.4 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,980px);border:1px solid #ffffff28;border-radius:26px;padding:clamp(18px,4vw,32px);background:#101a35dd;box-shadow:0 22px 70px #0008}header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}h1{margin:0;font-size:clamp(27px,5vw,44px);line-height:1.05}p{color:#cad4f2;margin:10px 0}.back{color:#b9dcff;text-decoration:none;font-weight:700}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:16px 0}.pill{border-radius:12px;background:#ffffff12;padding:9px 14px;font-weight:800}.btn{border:0;border-radius:13px;padding:10px 13px;background:#f8c85b;color:#17203f;font-weight:900;font-size:14px;cursor:pointer}.arena{background:#080d22;border:1px solid #ffffff33;border-radius:20px;overflow:hidden}.arena canvas{display:block;width:100%;height:auto}.hint{font-size:13px;color:#bdcae8}
.arena{max-width:900px}.hud .pill{flex:1;text-align:center}.arena canvas{touch-action:none}</style></head><body><main class="wrap"><header><div><h1>Турбо-трасса: Ночной заезд</h1><p>Пройди три круга быстрее трёх соперников.</p></div><a class="back" href="../">← К каталогу примеров</a></header><div class="hud"><span class="pill">Круг: <b id="lap">0</b>/3</span><span class="pill">Место: <b id="place">4</b>/4</span><span class="pill">Скорость: <b id="speed">0</b></span><button class="btn" id="new">Новая гонка</button></div><div class="arena"><canvas id="c" width="900" height="580"></canvas></div><p class="hint">↑ / W — газ · ↓ / S — тормоз · ← → / A D — держаться на трассе · R — рестарт.</p><script>const c=document.querySelector("#c"),g=c.getContext("2d");let keys={},pos,spd,lane,ai,timer,go=false,last=0,stamp=0,lap=0,done=false;onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="r")start()};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.querySelector("#new").onclick=start;function start(){pos=0;spd=0;lane=0;lap=0;done=false;go=false;ai=[.02,.015,.01];stamp=performance.now()+3000;function tick(){if(performance.now()>=stamp){go=true;clearInterval(timer)}else{document.querySelector("#lap").textContent="3-2-1"} }timer=setInterval(tick,100);document.querySelector("#lap").textContent="0"}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(go&&!done){if(keys.arrowup||keys.w)spd=Math.min(250,spd+115*dt);else spd=Math.max(55,spd-18*dt);if(keys.arrowdown||keys.s)spd=Math.max(0,spd-150*dt);lane+=(keys.arrowright||keys.d?1:0)*120*dt;lane-=(keys.arrowleft||keys.a?1:0)*120*dt;lane=Math.max(-34,Math.min(34,lane));if(Math.abs(lane)>29)spd=Math.max(55,spd-140*dt);pos+=spd*dt/4200;for(let i=0;i<3;i++)ai[i]+=(.047+i*.003)*dt;lap=Math.floor(pos)+1;if(lap>3){done=true;lap=3}document.querySelector("#lap").textContent=lap;document.querySelector("#speed").textContent=Math.round(spd)+" км/ч";let rank=1+ai.filter(a=>a>pos).length;document.querySelector("#place").textContent=rank}g.fillStyle="#101923";g.fillRect(0,0,900,580);g.fillStyle="#1c452e";g.fillRect(0,0,900,580);g.fillStyle="#eee2c0";g.beginPath();g.ellipse(450,290,350,235,0,0,Math.PI*2);g.fill();g.fillStyle="#343b4a";g.beginPath();g.ellipse(450,290,315,205,0,0,Math.PI*2);g.fill();g.fillStyle="#17422e";g.beginPath();g.ellipse(450,290,230,120,0,0,Math.PI*2);g.fill();g.strokeStyle="#f8edda";g.setLineDash([18,16]);g.lineWidth=3;g.beginPath();g.ellipse(450,290,275,165,0,0,Math.PI*2);g.stroke();g.setLineDash([]);g.fillStyle="#fff";for(let i=0;i<20;i++){let a=i*Math.PI/10;g.fillRect(450+Math.cos(a)*350-3,290+Math.sin(a)*235-3,8,8)}function car(a,r,color,size=1){let x=450+Math.cos(a)*r,y=290+Math.sin(a)*(r*.67);g.save();g.translate(x,y);g.rotate(a+Math.PI/2);g.fillStyle="#070a11";g.fillRect(-16*size,-24*size,32*size,48*size);g.fillStyle=color;g.beginPath();g.roundRect(-12*size,-23*size,24*size,44*size,6);g.fill();g.fillStyle="#adeeff";g.fillRect(-8*size,-12*size,16*size,12*size);g.fillStyle="#ffe6a0";g.fillRect(-9*size,-23*size,5*size,3*size);g.fillRect(4*size,-23*size,5*size,3*size);g.restore()}for(let i=0;i<3;i++)car((ai[i]%1)*Math.PI*2,280+i*25,["#ec6b59","#4cc8df","#b98afa"][i],.85);let a=(pos%1)*Math.PI*2;car(a, lane+270,"#ffd35d",1.12);g.fillStyle="#fff";g.fillRect(450,290-235,7,60);if(!go||done){g.fillStyle="#050916cc";g.fillRect(0,0,900,580);g.fillStyle="#fff";g.textAlign="center";g.font="bold 30px system-ui";g.fillText(done?"Финиш!":"ТУРБО-ТРАССА",450,270);g.font="17px system-ui";g.fillText(done?("Твоё место: "+document.querySelector("#place").textContent):"Нажми «Новая гонка»",450,305)}requestAnimationFrame(loop)}start();go=false;loop(0);</script></main></body></html>
