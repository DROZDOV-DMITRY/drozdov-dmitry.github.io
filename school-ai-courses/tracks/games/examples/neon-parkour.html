<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Неон-паркур: Побег из мегаполиса · пример игры</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#273665,#090f27 65%);color:#f6f7ff;font:16px/1.4 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,980px);border:1px solid #ffffff28;border-radius:26px;padding:clamp(18px,4vw,32px);background:#101a35dd;box-shadow:0 22px 70px #0008}header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}h1{margin:0;font-size:clamp(27px,5vw,44px);line-height:1.05}p{color:#cad4f2;margin:10px 0}.back{color:#b9dcff;text-decoration:none;font-weight:700}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:16px 0}.pill{border-radius:12px;background:#ffffff12;padding:9px 14px;font-weight:800}.btn{border:0;border-radius:13px;padding:11px 16px;background:#f8c85b;color:#17203f;font-weight:900;font-size:15px;cursor:pointer}.btn:hover{filter:brightness(1.08)}button:focus-visible,a:focus-visible{outline:3px solid #7ee9ff;outline-offset:3px}
.arena{position:relative;background:#0a1025;border:1px solid #ffffff33;border-radius:20px;overflow:hidden}.arena canvas{display:block;width:100%;height:auto;touch-action:none}.hint{font-size:13px;color:#bdcae8}.hud{justify-content:flex-start}.pill{flex:1;text-align:center}</style></head><body><main class="wrap"><header><div><h1>Неон-паркур: Побег из мегаполиса</h1><p>Собери кристаллы, перепрыгни разрывы и доберись до портала.</p></div><a class="back" href="../">← К каталогу примеров</a></header><div class="hud"><span class="pill">💎 <b id="gems">0</b>/10</span><span class="pill">Падения: <b id="falls">0</b></span><span class="pill">Путь: <b id="progress">0</b>%</span><button class="btn" id="restart">R · Заново</button></div><div class="arena"><canvas id="game" width="900" height="450"></canvas></div><p class="hint">A/D или ←/→ — бег · Пробел / ↑ — прыжок · Доберись до бирюзового портала.</p><script>const c=document.querySelector("#game"),x=c.getContext("2d");const W=2500,ground=380,plats=[[0,380,380],[460,330,260],[790,290,250],[1090,340,270],[1430,285,260],[1770,330,300],[2160,370,340]];let p,keys={},gems,falls,started=false,done=false,last=0,camera=0;function reset(){p={x:35,y:330,vx:0,vy:0,w:27,h:45,on:false};gems=[[220,335],[520,285],[680,285],[860,245],[1010,245],[1190,295],[1510,240],[1690,240],[1850,285],[2240,325]].map(a=>({x:a[0],y:a[1],got:false}));falls=0;done=false;started=true}onkeydown=e=>{keys[e.key.toLowerCase()]=true;if([" ","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="r")reset();if((e.key===" "||e.key==="ArrowUp"||e.key.toLowerCase()==="w")&&!p.on)return};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.querySelector("#restart").onclick=reset;function draw(){x.clearRect(0,0,900,450);let sky=x.createLinearGradient(0,0,0,450);sky.addColorStop(0,"#10123b");sky.addColorStop(1,"#17102c");x.fillStyle=sky;x.fillRect(0,0,900,450);for(let i=0;i<40;i++){x.fillStyle="#d8e8ff";x.globalAlpha=.25+(i%3)*.15;x.fillRect((i*89-camera*.25)%900,35+(i*53)%180,2,2)}x.globalAlpha=1;for(let i=-1;i<7;i++){let bx=i*190-camera*.2;x.fillStyle="#171c48";x.fillRect(bx,185+(i*37%75),110,260);for(let j=0;j<5;j++){x.fillStyle="#48caff55";x.fillRect(bx+12+j*18,205+(i*37%75),6,14)}}for(const [a,b,w] of plats){x.fillStyle="#27245d";x.fillRect(a-camera,b,w,450-b);x.fillStyle="#27e4ee";x.fillRect(a-camera,b,w,5);x.fillStyle="#5d53a1";x.fillRect(a-camera,b+12,w,4)}for(const q of gems)if(!q.got){x.save();x.translate(q.x-camera,q.y);x.rotate(performance.now()/500);x.fillStyle="#72f7ff";x.shadowColor="#52dfff";x.shadowBlur=15;x.beginPath();x.moveTo(0,-12);x.lineTo(10,0);x.lineTo(0,12);x.lineTo(-10,0);x.closePath();x.fill();x.restore()}const portal=W-140-camera;x.fillStyle="#35f6e7";x.shadowColor="#43ffee";x.shadowBlur=24;x.fillRect(portal,310,30,70);x.shadowBlur=0;x.fillStyle="#f49852";for(const a of [390,740,1400,1740])x.fillRect(a-camera,ground,48,9);if(started){x.fillStyle="#f5c45f";x.fillRect(p.x-camera,p.y,p.w,p.h);x.fillStyle="#17254a";x.fillRect(p.x-camera+5,p.y+8,18,10);x.fillStyle="#44e8ff";x.fillRect(p.x-camera+7,p.y+11,14,4);x.fillStyle="#ed9e5d";x.fillRect(p.x-camera+3,p.y+35,7,10);x.fillRect(p.x-camera+18,p.y+35,7,10)}if(!started||done){x.fillStyle="#080c1dcc";x.fillRect(0,0,900,450);x.fillStyle="#fff";x.textAlign="center";x.font="bold 30px system-ui";x.fillText(done?"Финиш! Портал пройден":"НЕОН-ПАРКУР",450,200);x.font="17px system-ui";x.fillText(done?"Нажми R, чтобы сыграть ещё раз":"Нажми кнопку R или начни двигаться",450,238)}}function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(started&&!done){let dir=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);p.vx=dir*220;if((keys[" "]||keys.arrowup||keys.w)&&p.on){p.vy=-470;p.on=false}p.vy+=1150*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;for(const [a,b,w] of plats)if(p.vy>=0&&p.x+p.w>a&&p.x<a+w&&p.y+p.h>=b&&p.y+p.h<=b+20){p.y=b-p.h;p.vy=0;p.on=true}if(p.y>500){falls++;document.querySelector("#falls").textContent=falls;p.x=35;p.y=330;p.vy=0}for(const q of gems)if(!q.got&&Math.hypot(p.x+14-q.x,p.y+22-q.y)<24){q.got=true;document.querySelector("#gems").textContent=gems.filter(a=>a.got).length}camera=Math.max(0,Math.min(W-900,p.x-330));if(p.x>W-165)done=true;document.querySelector("#progress").textContent=Math.min(100,Math.floor(p.x/(W-150)*100))}draw();requestAnimationFrame(loop)}reset();started=false;loop(0);</script></main></body></html>
