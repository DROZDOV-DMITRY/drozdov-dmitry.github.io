<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Битва стихий · пример игры</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#273665,#090f27 65%);color:#f6f7ff;font:16px/1.4 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,900px);border:1px solid #ffffff28;border-radius:26px;padding:clamp(18px,4vw,32px);background:#101a35dd;box-shadow:0 22px 70px #0008}header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}h1{margin:0;font-size:clamp(27px,5vw,44px);line-height:1.05}p{color:#cad4f2;margin:10px 0}.back{color:#b9dcff;text-decoration:none;font-weight:700}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:20px 0}.pill{border-radius:12px;background:#ffffff12;padding:9px 14px;font-weight:800}.field{position:relative;border-radius:22px;min-height:350px;overflow:hidden;background:linear-gradient(145deg,#101e49,#231346);border:1px solid #ffffff33;display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:12px 18px;background:#f8c85b;color:#17203f;font-weight:900;font-size:16px;cursor:pointer}.btn:hover{filter:brightness(1.08)}button:focus-visible,a:focus-visible{outline:3px solid #7ee9ff;outline-offset:3px}

<style>.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.choice{font-size:25px}.result{text-align:center;font-size:22px;font-weight:900;min-height:50px;margin:24px 0}.rules{font-size:14px;color:#c6d2f0}</style>
<div class="hud"><span class="pill">Ты: <b id="you">0</b></span><span class="pill">Компьютер: <b id="cpu">0</b></span><button class="btn" id="reset">Новый матч</button></div><p class="rules">🔥 побеждает 🌿 · 🌿 побеждает 💧 · 💧 побеждает 🔥</p><div class="field"><div><div class="choices"><button class="btn choice" data-v="f">🔥 Огонь</button><button class="btn choice" data-v="w">💧 Вода</button><button class="btn choice" data-v="l">🌿 Листья</button></div><div class="result" id="result">Выбери стихию</div></div></div></style></head><body><main class="wrap"><header><div><h1>Битва стихий</h1><p>Первым набери пять побед. Ничья не даёт очков.</p></div><a class="back" href="../">← К каталогу примеров</a></header>
<style>.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.choice{font-size:25px}.result{text-align:center;font-size:22px;font-weight:900;min-height:50px;margin:24px 0}.rules{font-size:14px;color:#c6d2f0}</style>
<div class="hud"><span class="pill">Ты: <b id="you">0</b></span><span class="pill">Компьютер: <b id="cpu">0</b></span><button class="btn" id="reset">Новый матч</button></div><p class="rules">🔥 побеждает 🌿 · 🌿 побеждает 💧 · 💧 побеждает 🔥</p><div class="field"><div><div class="choices"><button class="btn choice" data-v="f">🔥 Огонь</button><button class="btn choice" data-v="w">💧 Вода</button><button class="btn choice" data-v="l">🌿 Листья</button></div><div class="result" id="result">Выбери стихию</div></div></div><script>let a=0,b=0,done=false;const names={f:"🔥 Огонь",w:"💧 Вода",l:"🌿 Листья"},win={f:"l",l:"w",w:"f"};function round(v){if(done)return;let c=["f","w","l"][Math.random()*3|0];let t="Ты: "+names[v]+" · Компьютер: "+names[c]+" — ";if(v!==c){if(win[v]===c){a++;t+="раунд твой!"}else{b++;t+="раунд компьютера"}}else t+="ничья";document.querySelector("#result").textContent=t;document.querySelector("#you").textContent=a;document.querySelector("#cpu").textContent=b;if(a===5||b===5){done=true;document.querySelector("#result").textContent+=" Матч выиграл "+(a===5?"ты!":"компьютер.")}}document.querySelectorAll(".choice").forEach(x=>x.onclick=()=>round(x.dataset.v));document.querySelector("#reset").onclick=()=>{a=b=0;done=false;document.querySelector("#you").textContent="0";document.querySelector("#cpu").textContent="0";document.querySelector("#result").textContent="Выбери стихию"};</script></main></body></html>
