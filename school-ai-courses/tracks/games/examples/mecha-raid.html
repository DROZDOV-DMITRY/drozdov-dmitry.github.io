.arena{position:relative}.hud{justify-content:flex-start}.pill{flex:1;text-align:center}.arena canvas{touch-action:none}</style></head><body><main class="wrap"><header><div><h1>Меха-рейд: Штурм технобазы</h1><p>Пройди базу, победи патрули и уничтожь босса.</p></div><a class="back" href="../">← К каталогу примеров</a></header><div class="hud"><span class="pill">Здоровье: <b id="hp">5</b>/5</span><span class="pill">Враги: <b id="score">0</b></span><span class="pill">Босс: <b id="boss">—</b></span><button class="btn" id="reset">Начать / заново</button></div><div class="arena"><canvas id="c" width="900" height="470"></canvas></div><p class="hint">A/D или ←/→ — движение · W/↑/пробел — прыжок · J — лазер · R — заново.</p><script>const c=document.querySelector("#c"),g=c.getContext("2d");let keys={},p,shots,enemies,hp,kills,boss,active=false,won=false,cam=0,last=0;const floors=[0,430,950,1460,1950,2550],plats=[[270,340,150],[610,300,170],[1020,350,180],[1370,310,150],[1760,350,200],[2180,330,150]];onkeydown=e=>{keys[e.key.toLowerCase()]=true;if([" ","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="r")reset()};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.querySelector("#reset").onclick=reset;function reset(){p={x:45,y:350,vx:0,vy:0,on:false,face:1,cd:0,inv:0};shots=[];hp=5;kills=0;boss={x:2400,y:345,h:12,cd:1};enemies=[];for(let i=0;i<6;i++)enemies.push({x:370+i*330,y:370,h:2,dir:i%2?1:-1,drone:i%3===0});active=true;won=false}function loop(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(active){let d=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);p.vx=d*220;if(d)p.face=d;if((keys.w||keys.arrowup||keys[" "])&&p.on){p.vy=-490;p.on=false}p.vy+=1150*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;for(const [a,b,w] of plats)if(p.vy>=0&&p.x+p.w>a&&p.x<a+w&&p.y+p.h>=b&&p.y+p.h<b+18){p.y=b-p.h;p.vy=0;p.on=true}if(p.y>500){hp--;p.x=Math.max(35,p.x-350);p.y=330;p.vy=0}p.cd-=dt;p.inv=Math.max(0,p.inv-dt);if(keys.j&&p.cd<=0){shots.push({x:p.x+p.face*25,y:p.y+20,vx:p.face*520,enemy:false});p.cd=.28}for(const e of enemies){e.x+=e.dir*e.drone?0:e.dir*45*dt;if(e.x<p.x-300||e.x>p.x+500)e.dir*=-1;e.cd=(e.cd||1)-dt;if(e.cd<=0){shots.push({x:e.x,y:e.y,vx:e.x<p.x?110:-110,enemy:true});e.cd=1.7}}boss.cd-=dt;if(Math.abs(p.x-boss.x)<500&&boss.cd<=0){shots.push({x:boss.x-35,y:boss.y+15,vx:-230,enemy:true});boss.cd=1.1}for(const b of shots){b.x+=b.vx*dt;if(!b.enemy){for(const e of enemies)if(e.h>0&&Math.abs(b.x-e.x)<25&&Math.abs(b.y-e.y)<35){e.h--;b.x=9999;if(e.h<=0){kills++;}}if(Math.abs(b.x-boss.x)<60&&Math.abs(b.y-boss.y)<50&&boss.h>0){boss.h--;b.x=9999}}else if(Math.abs(b.x-p.x)<20&&Math.abs(b.y-p.y)<35&&p.inv<=0){hp--;p.inv=1;b.x=9999}}shots=shots.filter(b=>b.x>cam-100&&b.x<cam+1050);for(const e of enemies)if(e.h>0&&Math.abs(e.x-p.x)<24&&Math.abs(e.y-p.y)<35&&p.inv<=0){hp--;p.inv=1}if(boss.h<=0){active=false;won=true}if(hp<=0){active=false;won=false}cam=Math.max(0,Math.min(2550-900,p.x-320));document.querySelector("#hp").textContent=hp;document.querySelector("#score").textContent=kills;document.querySelector("#boss").textContent=Math.max(0,boss.h)}g.fillStyle="#121f38";g.fillRect(0,0,900,470);for(let i=0;i<18;i++){let xx=(i*100-cam*.25)%950;g.fillStyle="#1d3852";g.fillRect(xx,80+(i%3)*28,64,260);g.fillStyle="#46d8e8";g.fillRect(xx+15,115,24,6)}for(const [a,b,w] of plats){g.fillStyle="#43566d";g.fillRect(a-cam,b,w,14);g.fillStyle="#37dae6";g.fillRect(a-cam,b,w,4)}g.fillStyle="#1b293d";g.fillRect(0,430,900,40);for(const e of enemies)if(e.h>0){g.fillStyle=e.drone?"#db5ec4":"#e37d4d";g.fillRect(e.x-cam-20,e.y-26,40,34);g.fillStyle="#9ef6ff";g.fillRect(e.x-cam-8,e.y-18,16,6)}if(boss.h>0){g.fillStyle="#d4485d";g.fillRect(boss.x-cam-40,boss.y-60,80,85);g.fillStyle="#ffcc6a";g.fillRect(boss.x-cam-20,boss.y-38,40,10)}for(const b of shots){g.fillStyle=b.enemy?"#ff788e":"#65f6ff";g.fillRect(b.x-cam,b.y,18,5)}if(p){g.fillStyle=p.inv>0&&t%100<50?"#fff":"#76eaff";g.fillRect(p.x-cam-15,p.y-45,30,45);g.fillStyle="#f8b45f";g.fillRect(p.x-cam-20,p.y+12,14,8);g.fillRect(p.x-cam+7,p.y+12,14,8);g.fillStyle="#18324c";g.fillRect(p.x-cam-8,p.y-34,17,8)}if(!active){g.fillStyle="#07111ddd";g.fillRect(0,0,900,470);g.fillStyle="#fff";g.textAlign="center";g.font="bold 28px system-ui";g.fillText(won?"Босс побеждён!":"МЕХА-РЕЙД",450,235);g.font="16px system-ui";g.fillText(won?"База освобождена":"Нажми «Начать / заново»",450,270)}requestAnimationFrame(loop)}reset();active=false;loop(0);</script></main></body></html>
