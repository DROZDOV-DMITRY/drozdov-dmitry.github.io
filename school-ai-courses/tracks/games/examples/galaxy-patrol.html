<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Галактический патруль · пример игры</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#273665,#090f27 65%);color:#f6f7ff;font:16px/1.4 system-ui,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,980px);border:1px solid #ffffff28;border-radius:26px;padding:clamp(18px,4vw,32px);background:#101a35dd;box-shadow:0 22px 70px #0008}header{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}h1{margin:0;font-size:clamp(27px,5vw,44px);line-height:1.05}p{color:#cad4f2;margin:10px 0}.back{color:#b9dcff;text-decoration:none;font-weight:700}.hud{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:16px 0}.pill{border-radius:12px;background:#ffffff12;padding:9px 14px;font-weight:800}.btn{border:0;border-radius:13px;padding:11px 16px;background:#f8c85b;color:#17203f;font-weight:900;font-size:15px;cursor:pointer}.arena{background:#080d22;border:1px solid #ffffff33;border-radius:20px;overflow:hidden}.arena canvas{display:block;width:100%;height:auto}.hint{font-size:13px;color:#bdcae8}
.arena{position:relative}.hud{justify-content:flex-start}.pill{flex:1;text-align:center}.arena canvas{touch-action:none}</style></head><body><main class="wrap"><header><div><h1>Галактический патруль</h1><p>Пройди три волны дронов и сохрани корабль.</p></div><a class="back" href="../">← К каталогу примеров</a></header><div class="hud"><span class="pill">Корпус: <b id="hp">3</b></span><span class="pill">Очки: <b id="score">0</b></span><span class="pill">Волна: <b id="wave">1</b>/3</span><button class="btn" id="start">Начать / заново</button></div><div class="arena"><canvas id="c" width="850" height="520"></canvas></div><p class="hint">WASD / стрелки — полёт · Пробел — лазер · Уничтожь все дроны в каждой волне.</p><script>const c=document.querySelector("#c"),g=c.getContext("2d");let keys={},player,bullets,enemies,rocks,eb,parts,hp,score,wave,active=false,done=false,last=0,spawn=0;onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key===" ")e.preventDefault()};onkeyup=e=>keys[e.key.toLowerCase()]=false;document.querySelector("#start").onclick=reset;function reset(){player={x:425,y:445,cd:0,inv:0};bullets=[];enemies=[];rocks=[];eb=[];parts=[];hp=3;score=0;wave=1;active=true;done=false;spawn=0;seed()}function seed(){for(let i=0;i<3+wave;i++)enemies.push({x:70+Math.random()*710,y:-Math.random()*300-20,h:2,spd:45+wave*9,t:Math.random()*9});for(let i=0;i<4;i++)rocks.push({x:40+Math.random()*770,y:-Math.random()*420-30,r:12+Math.random()*18,spd:55+Math.random()*35})}function boom(x,y,color){for(let i=0;i<12;i++)parts.push({x,y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,t:.5,color})}function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(active){player.inv=Math.max(0,player.inv-dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);player.x=Math.max(20,Math.min(830,player.x+dx*250*dt));player.y=Math.max(45,Math.min(500,player.y+dy*220*dt));player.cd-=dt;if(keys[" "]&&player.cd<=0){bullets.push({x:player.x,y:player.y-20,vy:-430});player.cd=.18}for(const b of bullets)b.y+=b.vy*dt;bullets=bullets.filter(b=>b.y>-20);for(const r of rocks){r.y+=r.spd*dt;if(r.y>550){r.y=-20;r.x=Math.random()*850}}for(const e of enemies){e.y+=e.spd*dt;e.x+=Math.sin(t/700+e.t)*45*dt;if(Math.random()<.003)e.shot=true;if(e.y>535){e.y=-20;e.x=Math.random()*850}}for(const b of bullets)for(const e of enemies)if(e.h>0&&Math.hypot(b.x-e.x,b.y-e.y)<23){e.h=0;b.y=-100;score+=100;boom(e.x,e.y,"#ff7bd5")}for(const r of rocks)if(Math.hypot(player.x-r.x,player.y-r.y)<r.r+14&&player.inv<=0){hp--;player.inv=1.2;boom(player.x,player.y,"#ffb254")}for(const e of enemies)if(e.h>0&&Math.hypot(player.x-e.x,player.y-e.y)<24&&player.inv<=0){hp--;player.inv=1.2;e.h=0}enemies=enemies.filter(e=>e.h>0);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}parts=parts.filter(p=>p.t>0);if(enemies.length===0){wave++;document.querySelector("#wave").textContent=Math.min(3,wave);if(wave>3){active=false;done=true}else seed()}if(hp<=0){active=false;done=true}document.querySelector("#hp").textContent=hp;document.querySelector("#score").textContent=score}g.fillStyle="#090e2a";g.fillRect(0,0,850,520);for(let i=0;i<100;i++){g.fillStyle=i%5===0?"#72d5ff":"#dce8ff";g.globalAlpha=.3+(i%4)*.15;g.fillRect((i*139)%850,(i*83+t/45)%520,2,2)}g.globalAlpha=1;for(const r of rocks){g.fillStyle="#9c8295";g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.fill()}for(const e of enemies){g.fillStyle="#ff5785";g.beginPath();g.moveTo(e.x,e.y+20);g.lineTo(e.x-20,e.y-15);g.lineTo(e.x,e.y-7);g.lineTo(e.x+20,e.y-15);g.closePath();g.fill();g.fillStyle="#ffdc8a";g.fillRect(e.x-8,e.y-3,16,5)}g.fillStyle="#71eaff";for(const b of bullets)g.fillRect(b.x-2,b.y,4,16);for(const p of parts){g.globalAlpha=p.t*2;g.fillStyle=p.color;g.fillRect(p.x,p.y,4,4)}g.globalAlpha=1;if(player&&active){g.fillStyle=player.inv>0&&t%120<60?"#fff":"#7eeaff";g.beginPath();g.moveTo(player.x,player.y-24);g.lineTo(player.x-20,player.y+20);g.lineTo(player.x,player.y+12);g.lineTo(player.x+20,player.y+20);g.closePath();g.fill();g.fillStyle="#ffa85a";g.fillRect(player.x-5,player.y+15,10,10)}if(!active){g.fillStyle="#020617ce";g.fillRect(0,0,850,520);g.fillStyle="#fff";g.textAlign="center";g.font="bold 28px system-ui";g.fillText(done?(hp>0?"Патруль завершён!":"Корабль потерян"):"Галактический патруль",425,245);g.font="16px system-ui";g.fillText("Нажми «Начать / заново»",425,280)}requestAnimationFrame(loop)}reset();active=false;loop(0);</script></main></body></html>
