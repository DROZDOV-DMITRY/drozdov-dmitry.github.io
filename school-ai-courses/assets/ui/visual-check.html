<!doctype html><html lang="ru"><meta charset="utf-8"><title>S14 visual QA</title><style>body{margin:0;background:#dce3ed;font:14px Arial}header{padding:8px;display:flex;gap:8px;align-items:center}button,select{padding:8px}#view{transform-origin:top left;border:0;background:white}#stage{margin:8px;overflow:hidden}#results{white-space:pre-wrap;margin:8px}#status{font-weight:bold}</style><header><select id="route"></select><select id="size"><option>1366×768</option><option>1920×1080</option><option>360×800</option><option>390×844</option><option>412×915</option></select><button id="show">Показать</button><button id="all">Проверить 75 состояний</button><button id="trail">Проверить снежинки</button><span id="status"></span></header><div id="stage"><iframe id="view"></iframe></div><pre id="results"></pre><script>
const routes=['','computer/','hotkeys/','skills/input/','tools/','tools/yandex-mail/','tracks/3d/','tracks/games/','tracks/video/','tracks/video/edit/','tracks/video/lesson-01/','tracks/video/mastery/','tracks/video/publish/','tracks/web/','tracks/web/publish/'];const sizes=[[1366,768],[1920,1080],[360,800],[390,844],[412,915]];let data=[];
route.innerHTML=routes.map(r=>`<option value="${r}">${r||'Главная'}</option>`).join('');
async function openFrame(r,w,h){view.style.width=w+'px';view.style.height=h+'px';const scale=Math.min(1,(innerWidth-16)/w);view.style.transform=`scale(${scale})`;stage.style.width=w*scale+'px';stage.style.height=h*scale+'px';await new Promise(resolve=>{view.onload=resolve;view.src='/school-ai-courses/'+r;});await new Promise(resolve=>view.contentWindow.requestAnimationFrame(()=>view.contentWindow.requestAnimationFrame(resolve)));}
function check(r,w,h){const d=view.contentDocument,v=view.contentWindow;const badImages=[...d.images].filter(i=>i.getBoundingClientRect().width>0&&!i.complete);const mainGnome=d.querySelector('.home-character');return {route:r||'/',size:[w,h],actual:[v.innerWidth,v.innerHeight],overflow:d.documentElement.scrollWidth>w,logo:!!d.querySelector('img[src*="logo-ai"]')?.naturalWidth,chat:!!d.querySelector('#s14QuickChatTop')&&!!d.querySelector('#s14QuickChat'),gnomeVisible:!!mainGnome&&v.getComputedStyle(mainGnome).display!=='none',gnomeRequested:w<=900&&[...v.performance.getEntriesByType('resource')].some(x=>x.name.includes('home-gnome.webp')),brokenImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),internalBlank:[...d.querySelectorAll('a[target="_blank"]')].filter(a=>a.origin===v.location.origin).length,hero:!!d.querySelector('.s14-topic-visual')||r==='',copyButtons:d.querySelectorAll('[data-copy]').length};}
show.onclick=async()=>{const [w,h]=size.value.split('×').map(Number);await openFrame(route.value,w,h);results.textContent=JSON.stringify(check(route.value,w,h),null,2);status.textContent='Текущий экран';};
all.onclick=async()=>{data=[];for(const r of routes)for(const [w,h] of sizes){status.textContent=`${data.length+1}/75 · ${r||'/'} · ${w}×${h}`;await openFrame(r,w,h);data.push(check(r,w,h));}results.textContent=JSON.stringify(data,null,2);status.textContent='75/75 завершено';};
trail.onclick=async()=>{const v=view.contentWindow,d=view.contentDocument;for(let i=0;i<8;i++){d.dispatchEvent(new v.PointerEvent('pointermove',{clientX:150+i*10,clientY:300,pointerType:'mouse'}));await new Promise(r=>setTimeout(r,45));}results.textContent='Частиц: '+d.querySelectorAll('.s14-snow-spark').length;};show.click();
</script></html>
